# Managed by prek (https://github.com/j178/prek)
exclude: ^pnpm-lock\.yaml$

repos:
    - repo: builtin
      hooks:
          - id: trailing-whitespace
          - id: end-of-file-fixer
          - id: check-yaml
          - id: check-json
          - id: check-merge-conflict
          - id: check-added-large-files

    - repo: local
      hooks:
          - id: biome
            name: biome check
            entry: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true
            language: system
            types_or: [javascript, ts, json]

          - id: typecheck
            name: tsc
            entry: pnpm exec tsc --noEmit
            language: system
            pass_filenames: false
            types: [ts]

          - id: commitlint
            name: commitlint
            entry: pnpm exec commitlint --edit
            language: system
            stages: [commit-msg]
            always_run: true
            pass_filenames: false
