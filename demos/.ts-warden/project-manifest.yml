# Entry point: each key is an arbitrary group name.
# `glob` is relative to the project root (the parent of `.ts-warden`);
# `config` is relative to this file.
controllers:
    - glob: src/controllers/**/*.controller.ts
      config: ./controller.yml
use-cases:
    - glob: src/use-cases/**/*.use-case.ts
      config: ./use-case-services.yml
handlers:
    - glob: src/handlers/**/*.handler.ts
      config: ./handler.yml
